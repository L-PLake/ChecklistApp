name: Bump app version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Increment and push app version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            current_version=$(sed -n 's/.*id="appVersion" aria-label="Version \([0-9][0-9]*\)">v\1<\/span>.*/\1/p' index.html)
            if [ -z "$current_version" ]; then
              echo "Could not find a consistent app version badge in index.html." >&2
              exit 1
            fi
            next_version=$((current_version + 1))
            sed -i "s#id=\"appVersion\" aria-label=\"Version ${current_version}\">v${current_version}</span>#id=\"appVersion\" aria-label=\"Version ${next_version}\">v${next_version}</span>#" index.html
            git commit -am "Bump app version to v${next_version}"

            if git push origin HEAD:main; then
              exit 0
            fi

            sleep "$attempt"
          done

          echo "Could not push the updated app version after 5 attempts." >&2
          exit 1
