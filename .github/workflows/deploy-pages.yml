name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Test checklist data handling
        run: node --test tests/*.test.mjs
      - name: Set deployed app version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text()
          pattern = re.compile(
              r'(<span id="appVersion" aria-label="Version )\d+\.\d+(">v)\d+\.\d+(</span>)'
          )
          version = f"1.{int(os.environ['GITHUB_RUN_NUMBER']) + 2}"
          updated, count = pattern.subn(
              lambda match: f"{match.group(1)}{version}{match.group(2)}{version}{match.group(3)}",
              html,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find the app version label in index.html.")
          path.write_text(updated)
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
