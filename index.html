<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Checklist">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>My Checklist</title>
<style>
:root{color-scheme:light;--bg:#f5f3ee;--panel:#fff;--text:#222d26;--muted:#858b83;--line:#e8e7df;--accent:#315d4b;--accent-soft:#eaf1ec;--shadow:0 24px 70px rgba(32,45,38,.18)}
*{box-sizing:border-box}
body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #86ae97;outline-offset:3px}
.app-shell{min-height:100vh}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.78)}
.brand{display:inline-flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;font-size:17px;font-weight:750;letter-spacing:-.025em}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--accent);color:#fff}
.brand-mark svg{width:19px;height:19px}
.top-back{display:none;align-items:center;gap:8px;margin-left:-8px;padding:8px;border:0;border-radius:10px;background:transparent;color:#56645a;font-size:14px;font-weight:680}
.top-back:hover{background:var(--accent-soft);color:var(--accent)}
.top-back svg{width:20px;height:20px}
.is-checklist .top-back{display:inline-flex}
.is-checklist #brandMark,.is-checklist #brandTitle{display:none}
.overflow{position:relative}
.overflow summary{list-style:none;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.overflow summary::-webkit-details-marker{display:none}
.overflow summary svg{width:18px;height:18px}
.overflow-menu{position:absolute;z-index:4;right:0;top:48px;width:224px;padding:7px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow)}
.overflow-menu button{display:block;width:100%;padding:10px 11px;border:0;border-radius:9px;background:transparent;text-align:left;font-size:14px}
.overflow-menu button:hover{background:var(--bg)}
.overflow-menu .danger{color:#a84236}
.app-layout{display:flex;min-height:calc(100vh - 76px)}
.sidebar{width:278px;flex:0 0 278px;display:flex;flex-direction:column;padding:30px 18px 22px 24px;border-right:1px solid var(--line);background:#fbfaf7}
.sidebar-label{margin:0 0 12px 10px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
.sidebar-lists{display:grid;gap:4px}
.list-choice{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:11px;background:transparent;color:#606960;text-align:left}
.list-choice:hover{background:#f0efe9}
.list-choice.is-current{background:var(--accent-soft);color:var(--accent);font-weight:700}
.list-choice .list-icon{width:17px;height:17px;flex:0 0 17px;color:#8a938b}
.list-choice.is-current .list-icon{color:var(--accent)}
.list-choice .list-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.current-check{font-size:14px;font-weight:800}
.sidebar-new{display:flex;align-items:center;gap:9px;margin-top:auto;padding:12px;border:0;border-radius:11px;background:transparent;color:var(--accent);font-weight:700;text-align:left}
.sidebar-new:hover{background:var(--accent-soft)}
.sidebar-new span{font-size:21px;line-height:1}
.workspace{flex:1;min-width:0;padding:35px 30px 60px}
.workspace-inner{width:min(100%,740px);margin:0 auto}
.mobile-list-picker{display:none}
.checklist-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:15px 0 22px}
.title-edit-row{display:flex;align-items:center;gap:9px;min-width:0}
.title-edit-row h1{min-width:0}
.edit-title-button{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;margin-top:4px;border:0;border-radius:10px;background:transparent;color:#818a81}
.edit-title-button:hover{background:var(--accent-soft);color:var(--accent)}
.edit-title-button svg{width:18px;height:18px}
.checklist-notes{margin:-10px 0 24px}
.checklist-notes label{display:block;margin-bottom:6px;color:#717970;font-size:12px;font-weight:700}
.checklist-notes textarea{display:block;width:100%;min-height:44px;max-height:180px;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);font:inherit;line-height:1.5;resize:vertical}
.checklist-notes textarea::placeholder{color:#9ba198}
.checklist-notes textarea:hover{border-color:var(--line);background:rgba(255,255,255,.55)}
.checklist-notes textarea:focus{border-color:#8aa995;background:#fff;outline:3px solid rgba(134,174,151,.2)}
.eyebrow{margin:0 0 6px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.13em}
h1{margin:0;font-size:clamp(28px,4vw,38px);line-height:1.12;letter-spacing:-.045em;overflow-wrap:anywhere}
.count{padding-bottom:4px;color:var(--muted);font-size:13px;white-space:nowrap}
.task-list{padding:6px 0;border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:15px;min-height:60px;padding:13px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{appearance:none;flex:0 0 22px;width:22px;height:22px;margin:0;border:1.7px solid #b4b9b1;border-radius:7px;background:#fff;cursor:pointer}
.task input[type=checkbox]:checked{border-color:var(--accent);background:var(--accent)}
.task input[type=checkbox]:checked::after{content:"✓";display:block;color:#fff;font-size:15px;line-height:19px;text-align:center;font-weight:800}
.task-text{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}
.task.done .task-text{color:#999f98;text-decoration:line-through}
.task-remove{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#a1a69f;font-size:21px;line-height:1}
.task-remove:hover{background:#f1efea;color:#676f67}
.empty{padding:35px 8px;color:var(--muted);text-align:center}
.empty-mark{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:20px}
.empty p{margin:0}
.add-form{display:flex;gap:10px;margin-top:15px}
.add-form input,.dialog-form input,.dialog-form textarea,.selector-search{min-width:0;width:100%;padding:13px 15px;border:1px solid #dedfd8;border-radius:12px;background:#fff;color:var(--text)}
.add-form input::placeholder{color:#a0a59e}
.add-form input:focus,.dialog-form input:focus,.dialog-form textarea:focus,.selector-search:focus{border-color:#8aa995;outline:3px solid rgba(134,174,151,.2)}
.add-button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 17px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.add-button:hover{background:#264c3b}
.add-button span{font-size:19px}
#toast{min-height:22px;margin-top:10px;color:var(--accent);font-size:13px}
dialog{color:var(--text)}
dialog::backdrop{background:rgba(25,34,29,.35);backdrop-filter:blur(2px)}
.sheet{position:fixed;inset:auto 0 0;margin:0;width:100%;max-width:none;max-height:min(84dvh,740px);padding:0;border:0;border-radius:23px 23px 0 0;background:#fff;box-shadow:var(--shadow);overflow:auto}
.sheet-content{padding:13px 22px max(24px,env(safe-area-inset-bottom))}
.sheet-handle{width:38px;height:4px;margin:0 auto 17px;border-radius:4px;background:#dedfd9}
.sheet-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.sheet-heading h2{margin:0;font-size:19px;letter-spacing:-.02em}
.sheet-close{width:34px;height:34px;border:0;border-radius:10px;background:#f3f2ee;color:#687168;font-size:20px;line-height:1}
.selector-search{margin-bottom:10px}
.sheet-list{display:grid;gap:4px;max-height:48dvh;overflow:auto}
.sheet-list .list-choice{padding:13px 12px}
.sheet-divider{height:1px;margin:12px 0;background:var(--line)}
.sheet-new{width:100%;display:flex;align-items:center;gap:10px;padding:13px 12px;border:0;border-radius:11px;background:transparent;color:var(--accent);font-weight:750;text-align:left}
.sheet-new:hover{background:var(--accent-soft)}
.sheet-new span{font-size:21px;line-height:1}
.form-sheet{width:min(100% - 32px,440px);padding:0;border:0;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.form-sheet .sheet-content{padding:24px}
.form-sheet .sheet-handle{display:none}
.form-sheet .sheet-heading{margin-bottom:7px}
.dialog-hint{margin:0 0 18px;color:var(--muted);font-size:14px}
.dialog-form label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}
.dialog-form textarea{min-height:130px;resize:vertical}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}
.dialog-actions button{padding:10px 15px;border:0;border-radius:10px;font-weight:700}
.cancel-button{background:#f1f0eb;color:#566057}
.create-button{background:var(--accent);color:#fff}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.app-layout{display:block;min-height:calc(100vh - 76px);padding:54px 32px 72px}
.is-library .overflow{display:none}
.library-screen{width:min(100%,900px);margin:0 auto}
.library-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:32px}
.library-heading h1{font-size:clamp(31px,5vw,42px)}
.library-subtitle{margin:10px 0 0;color:var(--muted);font-size:15px}
.library-new{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.library-new:hover{background:#264c3b}
.library-new span{font-size:20px;line-height:1}
.library-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.library-card{display:flex;flex-direction:column;min-height:150px;padding:19px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--text);text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
.library-card:hover{transform:translateY(-2px);border-color:#c7d5ca;box-shadow:0 10px 28px rgba(32,45,38,.07)}
.library-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.library-card-title{font-size:17px;font-weight:730;letter-spacing:-.02em;overflow-wrap:anywhere}
.library-card-arrow{color:#9aa199;font-size:20px;line-height:1}
.library-card-meta{margin-top:auto;padding-top:21px;color:var(--muted);font-size:13px}
.library-card-progress{height:4px;margin-top:9px;border-radius:5px;background:#eeeee9;overflow:hidden}
.library-card-progress span{display:block;height:100%;border-radius:5px;background:#83a38d}
.last-opened{align-self:flex-start;margin-top:9px;padding:3px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
.library-empty{grid-column:1/-1;padding:52px 20px;border:1px dashed #d9dbd3;border-radius:17px;color:var(--muted);text-align:center}
.library-empty p{margin:0 0 14px}
.library-empty button{padding:9px 13px;border:0;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.library-tools{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-top:38px;padding:20px 0;border-top:1px solid var(--line)}
.library-tools h2{margin:0;font-size:16px;letter-spacing:-.02em}
.library-tools p{margin:4px 0 0;color:var(--muted);font-size:13px}
.library-tool-actions{display:flex;flex-wrap:wrap;gap:8px}
.library-tool-actions button{display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#526057;font-size:13px;font-weight:650}
.library-tool-actions button:hover{border-color:#c7d5ca;background:#fbfcfa;color:var(--accent)}
.library-tool-actions svg{width:17px;height:17px}
.checklist-content{width:min(100%,850px);margin:0 auto}
body.is-checklist .overflow{display:block}
#toast{position:fixed;z-index:6;left:50%;bottom:max(20px,env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 32px);padding:9px 14px;border:1px solid #dce6dd;border-radius:11px;background:#fff;box-shadow:0 8px 25px rgba(32,45,38,.12);text-align:center;transform:translateX(-50%)}
#toast:empty{display:none}
@media(max-width:760px){
 .topbar{height:66px;padding:0 20px}
 .app-layout{min-height:calc(100vh - 66px);padding:34px 21px max(38px,env(safe-area-inset-bottom))}
 .sidebar{display:none}
 .workspace{padding:20px 22px max(36px,env(safe-area-inset-bottom))}
 .mobile-list-picker{display:block;margin-bottom:14px}
 .mobile-list-picker button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;font-size:15px;font-weight:700}
 .mobile-list-picker svg{width:18px;height:18px;color:#798278}
 .checklist-heading{padding:14px 1px 19px}
 .count{font-size:12px}
 .task{min-height:58px}
 .add-form{gap:8px}
 .add-form input{padding:12px 13px}
 .add-button{padding:0 14px}
 .form-sheet{position:fixed;inset:auto 0 0;margin:0;width:100%;max-width:none;border-radius:23px 23px 0 0}
 .form-sheet .sheet-content{padding:13px 22px max(25px,env(safe-area-inset-bottom))}
 .form-sheet .sheet-handle{display:block}
 .library-heading{align-items:flex-start;flex-direction:column;gap:19px;margin-bottom:23px}
 .library-new{width:100%;justify-content:center}
 .library-grid{grid-template-columns:1fr;gap:10px}
 .library-card{min-height:132px;padding:16px}
 .library-tools{align-items:stretch;flex-direction:column;gap:14px;margin-top:30px;padding-top:17px}
 .library-tool-actions{display:grid;grid-template-columns:1fr}
 .library-tool-actions button{min-height:43px}
 .checklist-content{width:100%}
}
@media(min-width:761px){
 .sheet{border-radius:23px 23px 0 0}
}
</style>
</head>
<body class="is-library">
<div class="app-shell">
  <header class="topbar">
    <div class="brand" id="brand">
      <span class="brand-mark" id="brandMark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m6 12.5 3.7 3.7L18.5 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <button class="top-back" id="topBackButton" type="button" aria-label="Back to all checklists"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5M7.5 10H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>All checklists</span></button>
      <span id="brandTitle">My Checklist</span>
    </div>
    <details class="overflow" id="overflowMenu">
      <summary aria-label="Checklist options"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></summary>
      <div class="overflow-menu" aria-label="Checklist actions">
        <button type="button" data-action="clear">Clear ticks</button>
        <button type="button" class="danger" data-action="delete">Delete checklist</button>
      </div>
    </details>
  </header>
  <main class="app-layout">
    <section class="library-screen" id="libraryScreen" aria-labelledby="libraryTitle">
      <div class="library-heading">
        <div><p class="eyebrow">YOUR SPACE</p><h1 id="libraryTitle">Your checklists</h1><p class="library-subtitle">Pick up where you left off, or start a fresh list.</p></div>
        <button class="library-new" id="libraryNew" type="button"><span aria-hidden="true">+</span> New checklist</button>
      </div>
      <div class="library-grid" id="libraryLists" aria-label="All checklists"></div>
      <section class="library-tools" aria-labelledby="dataTitle">
        <div><h2 id="dataTitle">Your data</h2><p>Export or share all your checklists together.</p></div>
        <div class="library-tool-actions">
          <button type="button" id="exportBtn"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5v9m0 0 3.3-3.3M10 12.5 6.7 9.2M4 13v3h12v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Export backup</button>
          <button type="button" id="shareBtn"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 10.5 12.6 7m-5.1 4.5 5.1 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="5.5" cy="12" r="2" stroke="currentColor" stroke-width="1.5"/><circle cx="14.5" cy="5.5" r="2" stroke="currentColor" stroke-width="1.5"/><circle cx="14.5" cy="15.5" r="2" stroke="currentColor" stroke-width="1.5"/></svg>Share all lists</button>
          <button type="button" id="importBtn"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 12.5v-9m0 0L6.7 6.8M10 3.5l3.3 3.3M4 13v3h12v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Import backup</button>
        </div>
      </section>
    </section>
    <section class="checklist-content" id="checklistScreen" aria-label="Current checklist" hidden>
      <div class="workspace-inner">
        <div class="checklist-heading">
          <div><p class="eyebrow">YOUR CHECKLIST</p><div class="title-edit-row"><h1 id="listHeading">My list</h1><button class="edit-title-button" id="editTitleButton" type="button" aria-label="Edit checklist name" title="Edit checklist name"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m12.2 4.2 3.6 3.6M4 16l3.7-.8 8.5-8.5a1.8 1.8 0 0 0-2.6-2.6l-8.5 8.5L4 16Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
          <span class="count" id="count">0 items</span>
        </div>
        <div class="checklist-notes">
          <label for="notes">Notes</label>
          <textarea id="notes" maxlength="4000" rows="2" placeholder="Add a note for this checklist..."></textarea>
        </div>
        <div class="task-list" id="tasks" aria-live="polite"></div>
        <form class="add-form" id="addForm">
          <label class="visually-hidden" for="newTask">Add an item</label>
          <input id="newTask" placeholder="Add an item..." maxlength="240" autocomplete="off">
          <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add item</button>
        </form>
      </div>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<dialog class="form-sheet" id="createSheet" aria-labelledby="createTitle">
  <div class="sheet-content">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading"><h2 id="createTitle">New checklist</h2><button class="sheet-close" type="button" data-close="createSheet" aria-label="Close new checklist form">×</button></div>
    <p class="dialog-hint">Give your checklist a name to get started.</p>
    <form class="dialog-form" id="createForm">
      <label for="createName">Checklist name</label>
      <input id="createName" maxlength="80" autocomplete="off" placeholder="e.g. Weekend trip" required>
      <div class="dialog-actions"><button class="cancel-button" type="button" data-close="createSheet">Cancel</button><button class="create-button" type="submit">Create</button></div>
    </form>
  </div>
</dialog>
<dialog class="form-sheet" id="renameSheet" aria-labelledby="renameTitle">
  <div class="sheet-content">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-heading"><h2 id="renameTitle">Rename checklist</h2><button class="sheet-close" type="button" data-close="renameSheet" aria-label="Close rename form">×</button></div>
    <form class="dialog-form" id="renameForm">
      <label for="renameName">Checklist name</label>
      <input id="renameName" maxlength="80" autocomplete="off" required>
      <div class="dialog-actions"><button class="cancel-button" type="button" data-close="renameSheet">Cancel</button><button class="create-button" type="submit">Save name</button></div>
    </form>
  </div>
</dialog>
<input id="fileInput" type="file" accept="application/json,.json" hidden>

<script>
(() => {
  const KEY = 'my-offline-checklist-v1';
  const $ = id => document.getElementById(id);
  const makeId = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const normalizeList = (list, index) => ({
    id: typeof list.id === 'string' && list.id ? list.id : `list-${index}-${makeId()}`,
    title: String(list.title || 'My list'),
    tasks: Array.isArray(list.tasks) ? list.tasks.map(task => ({text: String(task?.text || ''), done: !!task?.done})).filter(task => task.text) : [],
    notes: String(list.notes || '')
  });
  const createInitial = () => ({lists: [{id: makeId(), title: 'My list', tasks: [], notes: ''}], activeListId: ''});
  let state = createInitial();
  const normalizeState = data => {
    if (Array.isArray(data.lists)) {
      const lists = data.lists.map(normalizeList);
      if (!lists.length) throw Error('No lists');
      return {lists, activeListId: lists.some(list => list.id === data.activeListId) ? data.activeListId : lists[0].id};
    }
    if (Array.isArray(data.tasks)) {
      const list = normalizeList(data, 0);
      return {lists: [list], activeListId: list.id};
    }
    throw Error('Invalid checklist');
  };

  const sharedData = new URLSearchParams(location.hash.slice(1)).get('share');
  let sharedLoadError = false;
  if (sharedData !== null) {
    try {
      const encoded = sharedData.replace(/-/g, '+').replace(/_/g, '/');
      if (!/^[A-Za-z0-9+/]*$/.test(encoded) || encoded.length % 4 === 1) throw Error('Invalid share URL');
      const bytes = Uint8Array.from(atob(encoded.padEnd(Math.ceil(encoded.length / 4) * 4, '=')), character => character.charCodeAt(0));
      state = normalizeState(JSON.parse(new TextDecoder('utf-8', {fatal: true}).decode(bytes)));
    } catch (_) {
      sharedLoadError = true;
    }
  }
  if (sharedData === null || sharedLoadError) {
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) state = normalizeState(JSON.parse(saved));
    } catch (_) {}
  }
  if (!state.activeListId) state.activeListId = state.lists[0].id;

  let currentPage = 'library';
  history.replaceState({}, '');
  const activeList = () => state.lists.find(list => list.id === state.activeListId) || state.lists[0];
  const toast = message => { $('toast').textContent = message; };
  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (_) {
      toast('Could not save. Export a backup.');
    }
    render();
  };
  const openChecklist = (listId, addHistory = true) => {
    state.activeListId = listId;
    currentPage = 'checklist';
    if (addHistory) history.pushState({checklist: true, listId}, '');
    save();
  };
  const goBack = () => {
    if (history.state?.checklist) {
      history.back();
      return;
    }
    currentPage = 'library';
    render();
  };
  const renderLibrary = () => {
    const cards = state.lists.map(list => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'library-card';
      button.setAttribute('aria-label', `Open checklist: ${list.title || 'Untitled checklist'}`);
      button.addEventListener('click', () => openChecklist(list.id));
      const top = document.createElement('span');
      top.className = 'library-card-top';
      const title = document.createElement('span');
      title.className = 'library-card-title';
      title.textContent = list.title || 'Untitled checklist';
      const arrow = document.createElement('span');
      arrow.className = 'library-card-arrow';
      arrow.setAttribute('aria-hidden', 'true');
      arrow.textContent = '↗';
      top.append(title, arrow);
      button.append(top);
      if (list.id === state.activeListId) {
        const lastOpened = document.createElement('span');
        lastOpened.className = 'last-opened';
        lastOpened.textContent = 'Last opened';
        button.append(lastOpened);
      }
      const done = list.tasks.filter(task => task.done).length;
      const meta = document.createElement('span');
      meta.className = 'library-card-meta';
      meta.textContent = `${list.tasks.length} ${list.tasks.length === 1 ? 'item' : 'items'} · ${done} done`;
      const progress = document.createElement('span');
      progress.className = 'library-card-progress';
      progress.setAttribute('aria-hidden', 'true');
      const fill = document.createElement('span');
      fill.style.width = `${list.tasks.length ? Math.round(done / list.tasks.length * 100) : 0}%`;
      progress.append(fill);
      button.append(meta, progress);
      return button;
    });
    if (!cards.length) {
      const empty = document.createElement('div');
      empty.className = 'library-empty';
      const message = document.createElement('p');
      message.textContent = 'No checklists yet. Create one to get started.';
      const create = document.createElement('button');
      create.type = 'button';
      create.textContent = 'Create a checklist';
      create.addEventListener('click', openCreateSheet);
      empty.append(message, create);
      cards.push(empty);
    }
    $('libraryLists').replaceChildren(...cards);
  };
  const render = () => {
    const list = activeList();
    const isChecklist = currentPage === 'checklist';
    document.body.classList.toggle('is-library', !isChecklist);
    document.body.classList.toggle('is-checklist', isChecklist);
    $('libraryScreen').hidden = isChecklist;
    $('checklistScreen').hidden = !isChecklist;
    $('brandTitle').textContent = isChecklist ? (list.title || 'Untitled checklist') : 'My Checklist';
    renderLibrary();
    $('listHeading').textContent = list.title || 'Untitled checklist';
    if ($('notes').value !== list.notes) $('notes').value = list.notes;
    const done = list.tasks.filter(task => task.done).length;
    $('count').textContent = `${list.tasks.length} ${list.tasks.length === 1 ? 'item' : 'items'} · ${done} done`;
    const rows = list.tasks.map((task, index) => {
      const row = document.createElement('div');
      row.className = `task${task.done ? ' done' : ''}`;
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = !!task.done;
      check.setAttribute('aria-label', `Mark ${task.text} complete`);
      check.addEventListener('change', () => {
        list.tasks[index].done = check.checked;
        save();
      });
      const text = document.createElement('span');
      text.className = 'task-text';
      text.textContent = task.text;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'task-remove';
      remove.textContent = '×';
      remove.setAttribute('aria-label', `Delete ${task.text}`);
      remove.addEventListener('click', () => {
        list.tasks.splice(index, 1);
        save();
      });
      row.append(check, text, remove);
      return row;
    });
    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="empty-mark" aria-hidden="true">✓</span><p>A clear space to start.<br>Add your first item below.</p>';
      $('tasks').replaceChildren(empty);
    } else {
      $('tasks').replaceChildren(...rows);
    }
  };
  const showDialog = (id, focusId) => {
    const dialog = $(id);
    if (!dialog.open) dialog.showModal();
    if (focusId) $(focusId).focus();
  };
  const openCreateSheet = () => {
    $('createName').value = '';
    $('createName').setCustomValidity('');
    showDialog('createSheet', 'createName');
  };
  const closeDialogFromBackdrop = dialog => {
    dialog.addEventListener('click', event => {
      if (event.target === dialog) dialog.close();
    });
    let touchStart;
    dialog.addEventListener('touchstart', event => {
      touchStart = event.changedTouches[0].clientY;
    }, {passive: true});
    dialog.addEventListener('touchend', event => {
      if (touchStart !== undefined && event.changedTouches[0].clientY - touchStart > 100) dialog.close();
      touchStart = undefined;
    }, {passive: true});
  };
  ['createSheet', 'renameSheet'].forEach(id => closeDialogFromBackdrop($(id)));
  document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => $(button.dataset.close).close()));

  $('libraryNew').addEventListener('click', openCreateSheet);
  $('topBackButton').addEventListener('click', goBack);
  $('editTitleButton').addEventListener('click', () => {
    $('renameName').value = activeList().title;
    showDialog('renameSheet', 'renameName');
  });
  $('exportBtn').addEventListener('click', () => exportBackup());
  $('shareBtn').addEventListener('click', () => shareChecklist());
  $('importBtn').addEventListener('click', () => $('fileInput').click());
  window.addEventListener('popstate', event => {
    currentPage = event.state?.checklist ? 'checklist' : 'library';
    render();
  });
  let swipeStart;
  $('checklistScreen').addEventListener('touchstart', event => {
    if (event.target.closest('button,input,textarea')) {
      swipeStart = null;
      return;
    }
    const touch = event.changedTouches[0];
    swipeStart = {x: touch.clientX, y: touch.clientY};
  }, {passive: true});
  $('checklistScreen').addEventListener('touchend', event => {
    if (!swipeStart) return;
    const touch = event.changedTouches[0];
    const deltaX = touch.clientX - swipeStart.x;
    const deltaY = Math.abs(touch.clientY - swipeStart.y);
    swipeStart = null;
    if (deltaX > 100 && deltaX > deltaY + 30) goBack();
  }, {passive: true});
  $('createForm').addEventListener('submit', event => {
    event.preventDefault();
    const input = $('createName');
    const title = input.value.trim();
    if (!title) {
      input.setCustomValidity('Enter a checklist name.');
      input.reportValidity();
      input.focus();
      return;
    }
    input.setCustomValidity('');
    const list = {id: makeId(), title, tasks: [], notes: ''};
    state.lists.push(list);
    $('createSheet').close();
    input.value = '';
    openChecklist(list.id);
    $('newTask').focus();
  });
  $('createName').addEventListener('input', event => event.target.setCustomValidity(''));
  $('renameForm').addEventListener('submit', event => {
    event.preventDefault();
    const title = $('renameName').value.trim();
    if (!title) {
      $('renameName').setCustomValidity('Enter a checklist name.');
      $('renameName').reportValidity();
      $('renameName').focus();
      return;
    }
    activeList().title = title;
    $('renameSheet').close();
    save();
  });
  $('renameName').addEventListener('input', event => event.target.setCustomValidity(''));
  $('notes').addEventListener('input', event => {
    activeList().notes = event.target.value;
    save();
  });
  $('addForm').addEventListener('submit', event => {
    event.preventDefault();
    const input = $('newTask');
    const text = input.value.trim();
    if (!text) {
      input.focus();
      return;
    }
    activeList().tasks.push({text, done: false});
    input.value = '';
    save();
    input.focus();
  });

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = 'my-checklist-backup.json';
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Backup exported. Keep it somewhere safe.');
  };
  const shareChecklist = async () => {
    const bytes = new TextEncoder().encode(JSON.stringify(state));
    let binary = '';
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    const encoded = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    const url = new URL(location.href);
    url.hash = `share=${encoded}`;
    try {
      if (!navigator.clipboard?.writeText) throw Error('Clipboard unavailable');
      await navigator.clipboard.writeText(url.href);
      toast('Share URL copied. Anyone with the link can view this checklist.');
    } catch (_) {
      if (window.prompt('Copy this share URL:', url.href) === null) toast('Share URL was not copied.');
      else toast('Share URL ready to paste. Anyone with the link can view this checklist.');
    }
  };
  const deleteChecklist = () => {
    if (state.lists.length === 1) {
      toast('Keep at least one checklist.');
      return;
    }
    const list = activeList();
    if (!confirm(`Delete "${list.title}" and all its items?`)) return;
    const index = state.lists.indexOf(list);
    state.lists.splice(index, 1);
    state.activeListId = state.lists[Math.max(0, index - 1)].id;
    currentPage = 'library';
    history.replaceState({}, '');
    save();
  };
  $('overflowMenu').addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    $('overflowMenu').open = false;
    switch (button.dataset.action) {
      case 'clear':
        activeList().tasks.forEach(task => { task.done = false; });
        save();
        toast('All ticks cleared.');
        break;
      case 'delete':
        deleteChecklist();
        break;
    }
  });
  $('fileInput').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      state = normalizeState(JSON.parse(await file.text()));
      save();
      toast('Backup imported.');
    } catch (_) {
      toast('That file is not a valid checklist backup.');
    }
    event.target.value = '';
  });

  render();
  if (sharedLoadError) toast('This share URL is invalid or damaged.');
  if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !reloading) {
        reloading = true;
        location.reload();
      }
    });
    navigator.serviceWorker.addEventListener('message', event => {
      if (event.data?.type === 'APP_UPDATE_AVAILABLE' && !reloading) {
        reloading = true;
        location.reload();
      }
    });
    window.addEventListener('load', async () => {
      try {
        const registration = await navigator.serviceWorker.register('./sw.js', {updateViaCache: 'none'});
        const checkForUpdates = () => {
          registration.update().catch(() => {
            if (navigator.onLine) toast('Could not check for updates.');
          });
          registration.active?.postMessage('CHECK_FOR_UPDATES');
        };
        checkForUpdates();
        window.addEventListener('focus', checkForUpdates);
        window.addEventListener('online', checkForUpdates);
        setInterval(checkForUpdates, 15 * 60 * 1000);
      } catch (_) {
        toast('Offline setup did not register; check hosting settings.');
      }
    });
  }
})();
</script>
</body>
</html>
